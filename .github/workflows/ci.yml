name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AgenticUI.NET.sln

      - name: Build
        run: dotnet build AgenticUI.NET.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AgenticUI.NET.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack AgenticUI.NET.sln --configuration Release --no-build --output artifacts/packages

      - name: Setup Node.js for documentation checks
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify documentation and packaged examples
        run: node scripts/verify-docs.mjs --build-examples --package-source artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
