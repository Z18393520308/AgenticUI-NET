name: Release NuGet packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  validate-publish:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "v$((Select-Xml -Path Directory.Build.props -XPath '/Project/PropertyGroup/VersionPrefix').Node.InnerText)"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match $expected"
          }

      - name: Restore
        run: dotnet restore AgenticUI.NET.sln

      - name: Build
        run: dotnet build AgenticUI.NET.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AgenticUI.NET.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack AgenticUI.NET.sln --configuration Release --no-build --output artifacts/packages

      - name: Setup Node.js for documentation checks
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify documentation and packaged examples
        run: node scripts/verify-docs.mjs --build-examples --package-source artifacts/packages

      - name: Prepare Chinese release notes
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '/Project/PropertyGroup/VersionPrefix').Node.InnerText
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '(?:[^\S\r\n]+[^\r\n]*)?\r?\n(?<notes>.*?)(?=^## |\z)'
          $section = [regex]::Match($changelog, $pattern)
          if (-not $section.Success -or [string]::IsNullOrWhiteSpace($section.Groups['notes'].Value)) {
            throw "CHANGELOG.md 缺少 $version 的中文发布说明"
          }
          $section.Groups['notes'].Value.Trim() | Set-Content artifacts/release-notes.md -Encoding utf8

      - name: NuGet login
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: login
        with:
          user: EmoZhang

      - name: Publish to nuget.org
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Get-ChildItem -Path "artifacts/packages" -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" artifacts/packages/* --verify-tag --title "AgenticUI.NET ${{ github.ref_name }}" --notes-file artifacts/release-notes.md

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
